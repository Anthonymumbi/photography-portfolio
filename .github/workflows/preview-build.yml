name: Preview Build Check

on:
  push:
    branches:
      - premium-redesign
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERCEL_ENV: preview
      VERCEL_URL: photography-preview.vercel.app
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
